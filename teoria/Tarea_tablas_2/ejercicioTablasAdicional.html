<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla corregida</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #11fcc950;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .general {
            width: 90%;
            max-width: 1000px;
            padding: 10px;
            background-color: white;
            border: 3px solid black;
        }
        h1 {
            text-align: center;
            color: green;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border: 3px solid black;
        }
        th {
            background-color: white;
            font-weight: bold;
        }
        h4 {
            text-align: center;
            color: green;
        }
    </style>
</head>
<body>
    <div class="general">
        <h1>GeeksforGeeks</h1>
        <h4>Table with Rowspan and Colspan</h4>
        <table>
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Class</th>
                    <th>School</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td rowspan="2">Mahima</td>
                    <td rowspan="2">Gupta</td>
                    <td rowspan="2">11<br>A</td>
                    <td rowspan="2">MVM School</td>
                </tr>
                <tr></tr>
                <tr>
                    <td rowspan="2">Sri</td>
                    <td rowspan="2">Krishn</td>
                    <td rowspan="2">3<br>B</td>
                    <td rowspan="2">LMS School</td>
                </tr>
                <tr></tr>
                <tr>
                    <td rowspan="2">Shivika</td>
                    <td rowspan="2">Goyal</td>
                    <td rowspan="2">5<br>A</td>
                    <td rowspan="2">SCPM School</td>
                </tr>
                <tr></tr>
            </tbody>
        </table>
    </div>
</body>
</html>
