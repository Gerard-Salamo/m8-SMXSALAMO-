<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejtablas2adicional</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #11fcc950;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 800px;
        }
        .general {
            width: 1200px;
            margin: 20px;
            padding: 4px;
            background-color: white;
            border: 3px solid black;
        }
        h1 {
            text-align: center;
            color: green;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 15.5px;
            text-align: left;
            border: 3px solid black;
        }
        th {
            background-color: white;
        }
        tr {
            background-color: white;
        }
        h4 {
            display: flex;
            justify-content: center;
            color: green;
        }
    </style>
</head>
<body>
    <div class="general">
        <h1>GeeksforGeeks</h1>
        <h4>Table with Rowspan and Colspan</h4>
        <table>
            <thead>
                <tr>
                    <th style="text-align: center;">First Name</th>
                    <th style="text-align: center;">Last Name</th>
                    <th style="text-align: center;">Class</th>
                    <th style="text-align: center;">Section</th>
                    <th style="text-align: center;">School</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td rowspan="2">Mahima</td>
                    <td rowspan="2">Gupta</td>
                    <td rowspan="2">11</td>
                    <td>A</td>
                    <td rowspan="2">MVM School</td>
                </tr>
                <tr>
                    <td>B</td>
                </tr>
                <tr>
                    <td rowspan="2">Sri</td>
                    <td rowspan="2">Krishn</td>
                    <td rowspan="2">3</td>
                    <td>A</td>
                    <td rowspan="2">LMS School</td>
                </tr>
                <tr>
                    <td>B</td>
                </tr>
                <tr>
                    <td rowspan="2">Shivika</td>
                    <td rowspan="2">Goyal</td>
                    <td rowspan="2">5</td>
                    <td>A</td>
                    <td rowspan="2">SCPM School</td>
                </tr>
                <tr>
                    <td>B</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
