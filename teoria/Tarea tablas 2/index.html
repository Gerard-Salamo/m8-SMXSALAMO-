<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejtablas2add</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #11fcc950;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 800px;
        }
        .general {
            width: 1000px;
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
            background-color: white;
        }
        h1 {
            text-align: center;
            color: green;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        caption {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="general">
        <h1>GeeksforGeeks</h1>
        <table>
            <caption>Table with Rowspan and Colspan</caption>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Class</th>
                    <th>School</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Mahima Gupta</td>
                    <td>11 A</td>
                    <td>MVM School</td>
                </tr>
                <tr>
                    <td>Sri Krishn</td>
                    <td>3 B</td>
                    <td>LMS School</td>
                </tr>
                <tr>
                    <td>Shivika Goyal</td>
                    <td>5 A</td>
                    <td>SCPM School</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
